# Missing Trailer Downloader for Emby (MTDE)
EMBY_URL: "http://emby:8096"
EMBY_API_KEY: "CHANGE_ME"

MOVIE_LIBRARIES:
  - "Movies"
  # - "Kids Movies"

# Search/download
PREFERRED_LANGUAGE: "german deutsch"
DOWNLOAD_TRAILERS: true
TRAILER_FOLDER: "trailers"
TRAILER_FILE_FORMAT: "mkv"
TRAILER_RESOLUTION_MIN: 1080
TRAILER_RESOLUTION_MAX: 2160
MAX_TRAILER_DURATION: 300
SEARCH_RESULTS: 8
SKIP_GENRES:
  - "Short"
  - "Concert"

# Refresh the affected Emby item after a successful local trailer download
REFRESH_EMBY_AFTER_DOWNLOAD: true

# Web UI
WEB_PORT: 2121

# Reserved for a later internal scheduler. 0 = disabled.
SCHEDULE_HOURS: 0

# Optional. Use when paths returned by Emby differ from paths mounted in MTDE.
# Example: Emby returns /data/media/movies/... while MTDE sees /media/movies/...
PATH_MAPPINGS:
  - emby: "/data/media"
    local: "/media"

# Optional Netscape-format cookies file for yt-dlp
# COOKIES_FILE: "/cookies/cookies.txt"
