# Missing Trailer Downloader for Emby (MTDE)

EMBY_URL: "http://emby:8096"
EMBY_API_KEY: "CHANGE_ME"
EMBY_TIMEOUT: 120

# Libraries are configured like upstream MTDP, with per-library genre exclusions.
MOVIE_LIBRARIES:
  - name: "Movies"
    genres_to_skip:
      - "Short"
      - "Concert"
  # - name: "Kids Movies"
  #   genres_to_skip: []

# Global safety switch. Keep this true for the first scan.
# When true, no trailer files are written/deleted and Emby is not refreshed.
DRY_RUN: true

# Trailer behavior
# false = remote/online Emby trailers do NOT prevent a local trailer download.
# true  = a remote/online Emby trailer counts as covered.
CHECK_REMOTE_TRAILERS: false
DOWNLOAD_TRAILERS: true
PREFERRED_LANGUAGE: "german"
REFRESH_EMBY_AFTER_DOWNLOAD: true
SHOW_YT_DLP_PROGRESS: false

TRAILER_FOLDER: "trailers"
TRAILER_FILE_FORMAT: "mkv"
TRAILER_RESOLUTION_MIN: 1080
TRAILER_RESOLUTION_MAX: 2160
MAX_TRAILER_DURATION: 300
# Upstream MTDP searches 15 YouTube results per query. MTDE keeps that as the
# minimum so the Emby port uses the same search depth and matching behavior.
SEARCH_RESULTS: 15

# Optional Netscape-format cookies file for yt-dlp.
# Standard Docker/Unraid template path:
#   Host:      /mnt/cache/appdata/mtde/cookies.txt
#   Container: /cookies/cookies.txt
# Leave empty/commented when you do not use cookies.
COOKIES_FILE: ""
# COOKIES_FILE: "/cookies/cookies.txt"

# off   = keep all existing local trailers
# local = replace a detected local trailer when its measured resolution is below
#         TRAILER_RESOLUTION_MIN. The old file is removed only after the better
#         trailer has downloaded successfully.
UPGRADE_TRAILERS: "off"

# Optional yt-dlp CLI-style options. MTDE blocks options that would override its
# output path, format and safety handling.
YT_DLP_CUSTOM_OPTIONS: []

# Scheduler: disabled | hours | cron
SCHEDULE_TYPE: "disabled"
SCHEDULE_HOURS: 24
SCHEDULE_CRON: "0 */6 * * *"

# Emby-native new-item detection uses lightweight polling. The first poll only
# establishes a baseline; later newly added movies trigger a scan after the delay.
NEW_ITEM_DETECTION: false
NEW_ITEM_DELAY: 60

WEB_PORT: 2121

# Prefer mounting media at the same container path in Emby and MTDE. If both see
# /data/media, leave this empty.
PATH_MAPPINGS: []

# Only needed when Emby and MTDE see the same files at different container paths:
# PATH_MAPPINGS:
#   - emby: "/data/media"
#     local: "/media"
